<!DOCTYPE html>

        </button>
        <button class="language-button" type="button" data-language="en" aria-label="English" data-en-aria-label="English" data-it-aria-label="Inglese" title="English" data-en-title="English" data-it-title="Inglese" aria-pressed="true">

            </button>
            <button class="language-button" type="button" data-language="en" aria-label="English" data-en-aria-label="English" data-it-aria-label="Inglese" title="English" data-en-title="English" data-it-title="Inglese" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="union-jack-clip-desktop"><circle cx="12" cy="12" r="12" /></clipPath></defs><g clip-path="url(#union-jack-clip-desktop)"><path fill="#012169" d="M0 0h24v24H0z"/><path fill="#fff" d="M0 0h4l20 14v4h-4L0 4zm20 0h4v4L4 24H0v-4z"/><path fill="#c8102e" d="M0 0h2l22 15.4V18L0 2.6zm22 0h2v2.6L2 24H0v-2.6z"/><path fill="#fff" d="M0 8h24v8H0zM8 0h8v24H8z"/><path fill="#c8102e" d="M0 10h24v4H0zM10 0h4v24h-4z"/></g></svg>

        </ul>

    <main class="container mx-auto px-4 py-8 md:pt-24 md:pb-12">
      <div class="text-center">
        <div class="profile-image-flip mx-auto mb-4" aria-label="Gaia Monteforte portrait" data-en-aria-label="Gaia Monteforte portrait" data-it-aria-label="Ritratto di Gaia Monteforte">
          <div class="profile-image-flip-inner">
            <img class="profile-image-flip-front" src="assets/contact/Bio_pic.png" alt="Gaia Monteforte" data-en-alt="Gaia Monteforte" data-it-alt="Gaia Monteforte" />
            <img class="profile-image-flip-back" src="assets/contact/bio_2.jpg" alt="" aria-hidden="true" />
          </div>
        </div>
        <h1 class="artist-name about-heading mb-6" data-en="About me" data-it="Chi sono">About me</h1>
      </div>

      <div class="max-w-2xl mx-auto px-8 md:px-16">
        <p id="artist-bio" class="leading-relaxed text-lg"></p>
      </div>

    <div class="social-links">

      </a>
      <a href="https://linkedin.com/in/gaia_monteforte" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
